[project]
name = "vuln-risk-lakehouse"
version = "0.1.0"
description = "End-to-end Databricks lakehouse for cybersecurity vulnerability risk analytics"
readme = "README.md"
authors = [
    { name = "Marwan Aljawarneh", email = "maljawarneh92@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "loguru>=0.8.0",
    "requests>=2.34.2",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
